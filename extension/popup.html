<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Deadline Tracker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="header">
      <h1>Deadline Tracker</h1>
      <p id="today" class="today"></p>
    </header>

    <!-- popup.js fills this with one section per day -->
    <main id="list" class="list"></main>
    <p id="empty" class="empty" hidden>No upcoming deadlines.</p>

    <!-- One line per source that couldn't be read -->
    <div id="errors" class="errors" hidden></div>

    <footer class="footer">
      <span id="status" class="status"></span>
      <div class="buttons">
        <button id="refresh" class="button button--plain" type="button">Refresh</button>
        <button id="download-ics" class="button" type="button">Download .ics</button>
      </div>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
