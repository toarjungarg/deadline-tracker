<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Deadline Tracker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="header">
      <h1>Deadline Tracker</h1>
      <p id="today" class="today"></p>
    </header>

    <!-- popup.js fills this with one section per day -->
    <main id="list" class="list"></main>
    <p id="empty" class="empty" hidden>No upcoming deadlines.</p>

    <footer class="footer">
      <span id="status" class="status"></span>
      <button id="download-ics" class="button" type="button">Download .ics</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
